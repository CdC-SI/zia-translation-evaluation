[project]
name = "zia-translation-evaluation"
version = "0.1.0"
description = "Evaluation pipeline that sends PDFs to the Zia translation endpoint and collects the translated results."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "markdown>=3.9",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "openai>=1.40.0",
    "pandas>=2.3.3",
    "pydantic>=2.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.2.1",
    "requests>=2.31.0",
    "seaborn>=0.13.2",
]

[project.scripts]
evaluate = "src.pipeline.evaluation:main"

[tool.uv]
package = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
